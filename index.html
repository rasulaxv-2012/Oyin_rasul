
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini GTA</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#345c40;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;color:white;background:#111c;padding:14px;border-radius:12px;line-height:1.8}
</style>
</head>
<body>
<div id="hud">
 💰 Pul: <span id="money">0</span><br>
 🚗 Mashina: <span id="status">Joq</span><br>
 WASD — Júriw<br>
 E — Mashinaǵa kiriw/shıǵıw
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h;
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();onresize=resize;
let keys={},money=0;
onkeydown=e=>{keys[e.key.toLowerCase()]=true};
onkeyup=e=>keys[e.key.toLowerCase()]=false;

let p={x:500,y:400,a:0};
let car={x:600,y:400,a:0};
let driving=false;
let coins=Array.from({length:30},(_,i)=>({
x:150+(i*173)%2000,y:150+(i*239)%1500,got:false
}));
let buildings=[];
for(let x=100;x<2200;x+=400)
for(let y=100;y<1600;y+=400)
buildings.push({x,y,w:240,h:240});

function rect(x,y,b){
return x>b.x-15&&x<b.x+b.w+15&&y>b.y-15&&y<b.y+b.h+15;
}
function update(){
let obj=driving?car:p;
let speed=driving?5:3;
if(keys.w||keys.arrowup){obj.x+=Math.cos(obj.a)*speed;obj.y+=Math.sin(obj.a)*speed}
if(keys.s||keys.arrowdown){obj.x-=Math.cos(obj.a)*speed;obj.y-=Math.sin(obj.a)*speed}
if(keys.a||keys.arrowleft)obj.a-=0.06;
if(keys.d||keys.arrowright)obj.a+=0.06;

obj.x=Math.max(10,Math.min(2390,obj.x));
obj.y=Math.max(10,Math.min(1790,obj.y));

if(keys.e){
keys.e=false;
if(driving){p.x=car.x+40;p.y=car.y;driving=false}
else if(Math.hypot(p.x-car.x,p.y-car.y)<65)driving=true;
document.getElementById('status').textContent=driving?'Bar':'Joq';
}
coins.forEach(q=>{
if(!q.got&&Math.hypot(obj.x-q.x,obj.y-q.y)<25){
q.got=true;money+=10;
document.getElementById('money').textContent=money;
}
});
}
function draw(){
update();
ctx.fillStyle='#448253';ctx.fillRect(0,0,w,h);
ctx.save();
ctx.translate(w/2-p.x,h/2-p.y);

// Roads
ctx.fillStyle='#343a40';
for(let x=0;x<2400;x+=400)ctx.fillRect(x-55,0,110,1800);
for(let y=0;y<1800;y+=400)ctx.fillRect(0,y-55,2400,110);

// Road lines
ctx.strokeStyle='#eee2a0';ctx.lineWidth=3;
ctx.setLineDash([20,20]);
for(let x=0;x<2400;x+=400){
ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1800);ctx.stroke();
}
for(let y=0;y<1800;y+=400){
ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(2400,y);ctx.stroke();
}
ctx.setLineDash([]);

// Buildings
buildings.forEach(b=>{
ctx.fillStyle='#263d31';ctx.fillRect(b.x-10,b.y-10,b.w+20,b.h+20);
ctx.fillStyle='#89928c';ctx.fillRect(b.x,b.y,b.w,b.h);
ctx.fillStyle='#d7d0b5';
for(let x=b.x+20;x<b.x+b.w-15;x+=50)
for(let y=b.y+20;y<b.y+b.h-15;y+=50)
ctx.fillRect(x,y,25,25);
});

// Coins
coins.forEach(q=>{
if(!q.got){
ctx.fillStyle='#ffdc38';
ctx.beginPath();ctx.arc(q.x,q.y,10,0,7);ctx.fill();
}
});

// Car
ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);
ctx.fillStyle='#171717';ctx.fillRect(-25,-15,50,30);
ctx.fillStyle='#e33e3e';ctx.fillRect(-22,-12,44,24);
ctx.fillStyle='#9ee9ff';ctx.fillRect(-8,-10,16,20);
ctx.restore();

// Player
if(!driving){
ctx.fillStyle='#18d9ee';
ctx.beginPath();ctx.arc(p.x,p.y,13,0,7);ctx.fill();
}
ctx.restore();
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
